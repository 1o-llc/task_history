[package]
name = "task_history"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Typed 1o task-history records: a task's revisions (base, fix1, ...) as v1.<identity>.1o.diff files, loaded, validated, queried, written and checked against the tree they describe"
keywords = ["1o", "history", "task", "diff", "records"]
categories = ["development-tools"]
authors = ["James Hunt <james@1o.business>"]
repository = "https://github.com/1o-llc/task_history"
readme = "README.md"
include = ["src/**", "schema/**", "Cargo.toml", "LICENSE*", "README*", "CHANGELOG*"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stable_digest = "0.1.1"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
core-1o = "0.1.1"
